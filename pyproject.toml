[project]
name = "zarrextract"
version = "0.1.1"
description = "Extract points, time series and bounding boxes from Zarr stores into Apache Arrow."
authors = [
    { name = "Lee Hart", email = "leehart3000@gmail.com" }
]
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["zarr", "arrow", "pyarrow", "netcdf", "climate", "geoscience", "time-series"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
    "Topic :: Scientific/Engineering :: GIS",
    "Typing :: Typed",
]
dependencies = ["zarr (>=3,<4)", "pyarrow (>=18)", "numpy (>=2)"]

[project.urls]
Homepage = "https://gitlab.com/leehart3000/zarrextract"
Source = "https://gitlab.com/leehart3000/zarrextract"
Issues = "https://gitlab.com/leehart3000/zarrextract/-/issues"

[tool.poetry]
packages = [{ include = "zarrextract", from = "src" }]

[build-system]
requires = ["poetry-core>=2.2.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "NPY", "PT"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]

[[tool.mypy.overrides]]
# pyarrow ships no type hints.
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
xfail_strict = true
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "ruff (>=0.17.6,<0.18.0)"
]
