# CI for zarrextract: checks on every push and merge request, and a release
# to PyPI (Trusted Publishing, with attestations) on version tags vX.Y.Z.

# Routine checks on every push run on GitHub Actions on the mirror
# (.github/workflows/ci.yml), which is free for public repositories.
# GitLab runs pipelines only for tags (releases), schedules and manual runs,
# to save compute minutes.
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"

stages:
  - check
  - test
  - build
  - publish

include:
  - template: Jobs/Secret-Detection.gitlab-ci.yml

variables:
  # Pinned so that releases are built the same way every time.
  POETRY_VERSION: "2.5.2"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PIP_ROOT_USER_ACTION: "ignore"
  PYTHON_KEYRING_BACKEND: "keyring.backends.null.Keyring"
  # Downloads are cached between jobs (see .poetry).
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  POETRY_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pypoetry"

.release-tag: &release-tag
  if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# Compute minutes are limited, so ordinary pushes test one Python version.
# Tags, scheduled and manually started pipelines test all of them.
.all-versions: &all-versions
  - if: $CI_COMMIT_TAG
  - if: $CI_PIPELINE_SOURCE == "schedule"
  - if: $CI_PIPELINE_SOURCE == "web"

.poetry:
  image: python:3.13-slim-trixie
  cache:
    key:
      files:
        - poetry.lock
      prefix: "${CI_JOB_NAME_SLUG}"
    paths:
      - .cache/pip
      - .cache/pypoetry/cache
      - .cache/pypoetry/artifacts
  before_script:
    - python -m pip install "poetry==${POETRY_VERSION}"
    - poetry install --no-interaction

lint:
  extends: .poetry
  stage: check
  script:
    - poetry check --lock
    - poetry run ruff check .
    - poetry run ruff format --check .
    - poetry run mypy

test:
  extends: .poetry
  stage: test
  script:
    - poetry run pytest

test-other-versions:
  extends: .poetry
  stage: test
  image: python:${PY}-slim-trixie
  parallel:
    matrix:
      - PY: ["3.12", "3.14"]
  rules: *all-versions
  script:
    - poetry run pytest

build:
  extends: .poetry
  stage: build
  script:
    - |
      version="$(poetry version --short)"
      if [ -n "${CI_COMMIT_TAG:-}" ] && [ "v${version}" != "${CI_COMMIT_TAG}" ]; then
        echo "Tag ${CI_COMMIT_TAG} does not match version ${version} in pyproject.toml"
        exit 1
      fi
    - poetry build --clean
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

attest:
  stage: publish
  image: python:3.13-slim-trixie
  needs:
    - job: build
      artifacts: true
  rules:
    - *release-tag
  id_tokens:
    SIGSTORE_ID_TOKEN:
      aud: sigstore
  script:
    - python -m pip install pypi-attestations
    - python -m pypi_attestations sign dist/*
  artifacts:
    paths:
      - dist/
    expire_in: 1 week

pypi:
  stage: publish
  image: python:3.13-slim-trixie
  needs:
    - job: lint
    - job: test
    - job: test-other-versions
    - job: attest
      artifacts: true
  rules:
    - *release-tag
  environment:
    name: pypi
    url: https://pypi.org/project/zarrextract/
  id_tokens:
    PYPI_ID_TOKEN:
      aud: pypi
  script:
    # With no token given, twine uses Trusted Publishing.
    - python -m pip install "twine>=6.1"
    - python -m twine upload --attestations dist/*
